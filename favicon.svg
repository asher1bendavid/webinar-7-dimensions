<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White background -->
  <rect width="100" height="100" rx="8" fill="#ffffff"/>

  <!-- Open book (gold) -->
  <path d="M14,72 L50,60 L50,82 L14,94 Z" fill="#c5a059"/>
  <path d="M86,72 L50,60 L50,82 L86,94 Z" fill="#a8863c"/>
  <path d="M14,72 L50,60 L86,72" fill="none" stroke="#8a6e2a" stroke-width="1.5"/>

  <!-- Mortarboard diamond -->
  <polygon points="50,18 86,36 50,54 14,36" fill="#1a2a44"/>

  <!-- Tassel cord -->
  <circle cx="85" cy="36" r="4" fill="#c5a059"/>
  <line x1="85" y1="40" x2="85" y2="58" stroke="#c5a059" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="58" x2="90" y2="58" stroke="#c5a059" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sparkle on cap -->
  <circle cx="46" cy="30" r="2" fill="#ffffff" opacity="0.6"/>
</svg>
