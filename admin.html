<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webinar Admin — Paretix Academy</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0a192f;
      --navy2:  #112240;
      --navy3:  #1d3557;
      --gold:   #c5a059;
      --gold2:  #e0b96a;
      --text:   #e6f1ff;
      --muted:  #8892a4;
      --border: #1e3a5f;
      --green:  #2ecc71;
      --red:    #e74c3c;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Login Screen ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .login-card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .login-card img {
      height: 44px;
      margin-bottom: 1.5rem;
    }

    .login-card h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .login-card p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .login-card input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--navy3);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-card input[type="password"]:focus { border-color: var(--gold); }

    .login-card button {
      width: 100%;
      padding: 0.75rem;
      background: var(--gold);
      color: var(--navy);
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-card button:hover { background: var(--gold2); }

    .login-error {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--red);
      min-height: 1.2rem;
    }

    /* ── Admin Layout ── */
    #admin-screen { display: none; }

    header {
      background: var(--navy2);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .logo-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    header img { height: 32px; }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gold);
    }

    header .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-gold { background: var(--gold); color: var(--navy); }
    .btn-gold:hover { background: var(--gold2); }
    .btn-outline { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-outline:hover { color: var(--text); border-color: var(--muted); }

    main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    /* ── Stats Bar ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }

    .stat-card .label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
    }

    /* ── Table ── */
    .table-wrap {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .table-toolbar {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .table-toolbar h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .table-overflow { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead th {
      background: var(--navy3);
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(197, 160, 89, 0.05); }

    tbody td {
      padding: 0.875rem 1rem;
      vertical-align: middle;
      color: var(--text);
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-he  { background: rgba(197,160,89,0.15); color: var(--gold); }
    .badge-en  { background: rgba(46,204,113,0.12); color: var(--green); }
    .badge-yes { background: rgba(46,204,113,0.12); color: var(--green); }
    .badge-no  { background: rgba(136,146,164,0.12); color: var(--muted); }

    .role-label { color: var(--muted); font-size: 0.82rem; }

    .empty-state {
      padding: 3rem;
      text-align: center;
      color: var(--muted);
    }

    /* ── Loading / Error ── */
    #loading-msg {
      padding: 3rem;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-card">
    <img src="/logo.png" alt="Paretix Academy" />
    <h1>Admin Dashboard</h1>
    <p>Webinar Registrations</p>
    <input type="password" id="pwd-input" placeholder="Enter admin password" autocomplete="current-password" />
    <button id="login-btn">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ══ ADMIN ══ -->
<div id="admin-screen">
  <header>
    <div class="logo-area">
      <img src="/logo.png" alt="Paretix Academy" />
      <h1>Webinar Admin</h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-gold" id="export-btn">Export CSV</button>
      <button class="btn btn-outline" id="logout-btn">Sign Out</button>
    </div>
  </header>

  <main>
    <div id="loading-msg">Loading registrations...</div>

    <div id="dashboard" style="display:none">
      <div class="stats" id="stats-bar"></div>

      <div class="table-wrap">
        <div class="table-toolbar">
          <h2>Registrations</h2>
        </div>
        <div class="table-overflow">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Lang</th>
                <th>Notify EN Date</th>
                <th>Notify Other</th>
                <th>Registered At</th>
              </tr>
            </thead>
            <tbody id="reg-tbody"></tbody>
          </table>
          <div class="empty-state" id="empty-state" style="display:none">No registrations yet.</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  const SESSION_KEY = 'wb_admin_pwd'

  const loginScreen  = document.getElementById('login-screen')
  const adminScreen  = document.getElementById('admin-screen')
  const pwdInput     = document.getElementById('pwd-input')
  const loginBtn     = document.getElementById('login-btn')
  const loginError   = document.getElementById('login-error')
  const logoutBtn    = document.getElementById('logout-btn')
  const exportBtn    = document.getElementById('export-btn')
  const loadingMsg   = document.getElementById('loading-msg')
  const dashboard    = document.getElementById('dashboard')
  const statsBar     = document.getElementById('stats-bar')
  const regTbody     = document.getElementById('reg-tbody')
  const emptyState   = document.getElementById('empty-state')

  let currentData = []

  // ── Auth ──────────────────────────────────────────────
  function showLogin() {
    loginScreen.style.display = 'flex'
    adminScreen.style.display = 'none'
    pwdInput.value = ''
    loginError.textContent = ''
  }

  function showAdmin() {
    loginScreen.style.display = 'none'
    adminScreen.style.display = 'block'
  }

  async function tryLogin(password) {
    loginError.textContent = ''
    loginBtn.disabled = true
    loginBtn.textContent = 'Signing in...'

    try {
      const res = await fetch('/api/admin', {
        headers: { 'Authorization': 'Bearer ' + password }
      })

      if (res.status === 401) {
        loginError.textContent = 'Incorrect password.'
        return
      }

      if (!res.ok) {
        loginError.textContent = 'Server error. Try again.'
        return
      }

      const json = await res.json()
      sessionStorage.setItem(SESSION_KEY, password)
      showAdmin()
      renderDashboard(json.registrations)
    } catch {
      loginError.textContent = 'Network error. Try again.'
    } finally {
      loginBtn.disabled = false
      loginBtn.textContent = 'Sign In'
    }
  }

  loginBtn.addEventListener('click', () => tryLogin(pwdInput.value.trim()))
  pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(pwdInput.value.trim()) })

  logoutBtn.addEventListener('click', () => {
    sessionStorage.removeItem(SESSION_KEY)
    currentData = []
    showLogin()
  })

  // ── Render ────────────────────────────────────────────
  const ROLE_LABELS = {
    analyst: 'Analyst',
    manager: 'Manager',
    ld: 'L&D',
    executive: 'Executive',
    other: 'Other',
  }

  function formatDate(iso) {
    if (!iso) return '—'
    const d = new Date(iso)
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
      + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
  }

  function badge(value, trueClass, falseClass, trueLabel, falseLabel) {
    return value
      ? `<span class="badge ${trueClass}">${trueLabel}</span>`
      : `<span class="badge ${falseClass}">${falseLabel}</span>`
  }

  function renderDashboard(registrations) {
    currentData = registrations || []
    loadingMsg.style.display = 'none'
    dashboard.style.display = 'block'

    // Stats
    const total     = currentData.length
    const heCount   = currentData.filter(r => r.lang === 'he').length
    const enCount   = currentData.filter(r => r.lang === 'en').length
    const notifyEn  = currentData.filter(r => r.notify_english).length
    const notifyOth = currentData.filter(r => r.notify_other_dates).length

    statsBar.innerHTML = [
      { label: 'Total Registrations', value: total },
      { label: 'Hebrew',              value: heCount },
      { label: 'English',             value: enCount },
      { label: 'Notify EN Date',      value: notifyEn },
      { label: 'Notify Other Dates',  value: notifyOth },
    ].map(s => `
      <div class="stat-card">
        <div class="label">${s.label}</div>
        <div class="value">${s.value}</div>
      </div>
    `).join('')

    // Table
    if (currentData.length === 0) {
      regTbody.innerHTML = ''
      emptyState.style.display = 'block'
      return
    }

    emptyState.style.display = 'none'
    regTbody.innerHTML = currentData.map((r, i) => `
      <tr>
        <td style="color:var(--muted)">${currentData.length - i}</td>
        <td><strong>${escHtml(r.name || '—')}</strong></td>
        <td style="font-family:monospace;font-size:0.82rem">${escHtml(r.email || '—')}</td>
        <td class="role-label">${ROLE_LABELS[r.role] || (r.role ? escHtml(r.role) : '—')}</td>
        <td>${r.lang === 'he'
          ? '<span class="badge badge-he">עב</span>'
          : '<span class="badge badge-en">EN</span>'}</td>
        <td>${badge(r.notify_english,      'badge-yes', 'badge-no', 'Yes', 'No')}</td>
        <td>${badge(r.notify_other_dates,  'badge-yes', 'badge-no', 'Yes', 'No')}</td>
        <td style="color:var(--muted);font-size:0.82rem;white-space:nowrap">${formatDate(r.registered_at)}</td>
      </tr>
    `).join('')
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
  }

  // ── CSV Export ────────────────────────────────────────
  exportBtn.addEventListener('click', () => {
    if (!currentData.length) return
    const cols = ['name', 'email', 'role', 'lang', 'notify_english', 'notify_other_dates', 'registered_at']
    const header = cols.join(',')
    const rows = currentData.map(r =>
      cols.map(c => {
        const v = r[c] ?? ''
        return typeof v === 'string' && (v.includes(',') || v.includes('"'))
          ? `"${v.replace(/"/g, '""')}"`
          : v
      }).join(',')
    )
    const csv = [header, ...rows].join('\n')
    const blob = new Blob([csv], { type: 'text/csv' })
    const url  = URL.createObjectURL(blob)
    const a    = document.createElement('a')
    a.href     = url
    a.download = `webinar-registrations-${new Date().toISOString().slice(0,10)}.csv`
    a.click()
    URL.revokeObjectURL(url)
  })

  // ── Auto-login if session exists ──────────────────────
  ;(async () => {
    const saved = sessionStorage.getItem(SESSION_KEY)
    if (!saved) { showLogin(); return }

    showAdmin()
    try {
      const res = await fetch('/api/admin', {
        headers: { 'Authorization': 'Bearer ' + saved }
      })
      if (res.status === 401) { sessionStorage.removeItem(SESSION_KEY); showLogin(); return }
      const json = await res.json()
      renderDashboard(json.registrations)
    } catch {
      loadingMsg.textContent = 'Failed to load data. Please refresh.'
    }
  })()
</script>
</body>
</html>
